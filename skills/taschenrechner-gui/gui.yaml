title: Taschenrechner
intro: Rechnen in umgekehrter polnischer Notation (ENTER wie beim HP-15C), mit LEARN eine Tastenfolge auf eine Kachel legen.
tiles:
  - title: Rechner
    text: Stack X, Y, Z, T; ENTER, CHS und die Kacheln A bis D
    html: rechner.html
    icon: calculator
  - title: Kacheln anzeigen
    text: Meine Kacheln und die mitgelieferten
    prompt: "Run the skill /taschenrechner. Zeige meine Kacheln und die mitgelieferten."
    icon: list
  - title: Kachel zurückspielen
    text: Meine Kacheln als Beitrag an den Hub senden
    prompt: "Run the skill /taschenrechner. Ich möchte meine Kacheln mit aios --contribute an das Paket zurückspielen."
    icon: upload
